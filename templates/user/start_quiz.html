<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ quiz.chapter_name }} - Start Quiz</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url("{{ url_for('static', filename='img/bgimage.jpg') }}") no-repeat center top fixed;
            background-size: cover; 
            background-position: center -5vh;
            background-attachment: fixed;
            padding: 40px;
            min-height: 100vh; /* Ensure it covers the whole screen */
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(45, 55, 76, 0.654); /* Dark overlay */
            z-index: -1;
        }
        .quiz-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 6px 6px 6px rgb(0, 0, 0);
        }
        .question-box {
            border: 2px solid #007bff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .timer-box {
            background: #ff2e2e;
            box-shadow: 6px 6px 8px rgb(0, 0, 0);
            font-size: 35px;
            width: 235px;
            border-radius: 10px;
            padding: 2px;
            font-weight: bold;
            position: fixed;
            top: 15px;
            right: 18px;
        }
    </style>
    <script>
        let timeDuration = "{{ quiz.time_duration }}";  // Format: HH:MM
        let timeParts = timeDuration.split(':');
        let totalSeconds = (parseInt(timeParts[0]) * 3600) + (parseInt(timeParts[1]) * 60); // Convert HH:MM to total seconds
        
        function startTimer() {
            let timerElement = document.getElementById("timer");
            let form = document.getElementById("quiz-form");
    
            let interval = setInterval(function() {
                let hours = Math.floor(totalSeconds / 3600);
                let minutes = Math.floor((totalSeconds % 3600) / 60);
                let seconds = totalSeconds % 60;
                
                // Display time in HH:MM:SS format
                timerElement.innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (totalSeconds <= 0) {
                    clearInterval(interval);
                    alert("Time's up! Your quiz is being submitted.");
                    form.submit();
                } else {
                    totalSeconds--; // Decrease time by 1 second
                }
            }, 1000); // Update every second
        }
    
        window.onload = startTimer;
    </script>
</head>
<body>
    <div class="timer-box">
        <img class ="mb-1" src="{{ url_for('static', filename='img/clock.svg') }}" alt="Clock Icon" width="55">
        <span id="timer"> 00:00:00</span>
    </div>
    <div class="quiz-container">
        <h3 class="text-center text-primary">{{ quiz.chapter_name }}</h3>
        <p class="text-center text-muted">{{ quiz.remarks }}</p>
        
        <form id="quiz-form" action="{{ url_for('user.start_quiz', quiz_id=quiz.id) }}" method="POST">
            {% for question in questions %}
                <div class="question-box">
                    <h5>{{ loop.index }}. {{ question.question_statement }}</h5>
                    {% for option_num in range(1, 5) %}
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="{{ question.id }}" id="option{{ question.id }}_{{ option_num }}" value="{{ option_num }}" required>
                            <label class="form-check-label" for="option{{ question.id }}_{{ option_num }}">
                                {{ question['option' + option_num|string] }}
                            </label>
                        </div>
                    {% endfor %}
                </div>
            {% endfor %}
            
            <div class="d-flex mt-4">
                <button type="submit" class="btn btn-success">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
