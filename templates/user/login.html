<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: url("{{ url_for('static', filename='img/bgimage.jpg') }}") no-repeat center top fixed;
            background-size: cover; 
            background-position: center -5vh;
            background-attachment: fixed;
            min-height: 100vh; /* Ensure it covers the whole screen */
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.078); /* Dark overlay */
            z-index: -1;
        }
        .login-container {
            display: flex;
            width: 800px;
            box-shadow: 10px 8px 8px rgba(0, 0, 0, 0.54);
            border-radius: 10px;
            overflow: hidden;
        }
        .left-section {
            width: 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #92a2e3d1;
            padding: 0px;
        }
        .left-section img {
            max-width: 300px;
            height: 360px;
        }
        
        .right-section {
            width: 60%;
            padding: 40px;
            background-color: #e9e9e9d9;
        }
        .form-control {
            border: 2px solid #000000;
            border-radius: 5px;
        }
        .btn-primary {
            width: 100%;
            border: none;
        }
        .btn-primary:hover {
            background-color: #000000;
        }
        
        
    </style>
</head>
<body>
<!-- Flash Message Container -->
<div id="flash-container" style="position: fixed; top: 20px; right: 20px; z-index: 1050;">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show flash-alert" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% endwith %}
</div>
<div class="login-container">
    <!-- Left Side -->
    <div class="left-section">
        <img src="{{ url_for('static', filename='img/user_login.png') }}" alt="Login Illustration">
    </div>

    <!-- Right Side -->
    <div class="right-section">
        <h3 class="text-dark mb-1">User Login</h3>
        <p class="text-muted mb-4">Login to access your account</p>
        <form action="{{ url_for('user.login') }}" method="POST">
            <!-- Email Field -->
            <div class="mb-3">
                <label class="form-label">Username (Email)</label>
                <input type="email" class="form-control" name="email" required>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <!-- Signup Link -->
        <p class="text-center mt-3">New User? <a href="{{ url_for('user.register') }}" class="text-danger">Register</a></p>
    </div>
</div>
<script>
    // Auto-hide flash messages after 3 seconds
    setTimeout(() => {
        const alerts = document.querySelectorAll('.flash-alert');
        alerts.forEach(alert => {
            // Use Bootstrap's fade out manually
            alert.classList.remove('show');
            alert.classList.add('hide');
            setTimeout(() => alert.remove(), 500); // Remove from DOM after fade out
        });
    }, 3000);
</script>
</body>
</html>
