<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ quiz.chapter_name }} - Quiz Details</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: url("{{ url_for('static', filename='img/bgimage.jpg') }}") no-repeat center top fixed;
            background-size: cover; 
            background-position: center -5vh;
            background-attachment: fixed;
            min-height: 100vh; /* Ensure it covers the whole screen */
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(45, 55, 76, 0.654); /* Dark overlay */
            z-index: -1;
        }
    
        .quiz-container {
            background: white;
            border: 2px solid #000;
            border-radius: 15px;
            margin-left: auto;
            margin-right: auto;
            padding: 20px;
            width: 450px;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 1);
            font-family: 'Arial', sans-serif;
        }
        
        .quiz-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .quiz-info label {
            font-weight: bold;
            width: 50%;
        }
        .quiz-info .quiz-field {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #000;
            border-radius: 5px;
            padding: 5px 10px;
            background-color: #f8f9fa;
            min-height: 30px;
            flex-grow: 1;
        }
        .quiz-info .quiz-field.green {
            background-color: #e6f7e6;
            color: #198754;
            font-weight: bold;
        }
        .quiz-info .quiz-field.red {
            background-color: #f8d7da;
            color: #dc3545;
            font-weight: bold;
        }
        .quiz-info .quiz-field.black {
            background-color: #a8a8a8;
            color: #000;
            font-weight: bold;
        }
        .btn-close-custom {
            display: block;
            width: 100%;
            margin-top: 20px;
            text-align: center;
            background: #b3d9ff;
            border-radius: 10px;
            font-weight: bold;
            padding: 8px;
            text-decoration: none;
            color: black;
            border: 2px solid #000;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 1);
        }
        .btn-close-custom:hover {
            background: #99c2ff;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h3 style="text-align: center; font-weight: bold; color:#416eff"> Quiz {{ quiz.id}} Details</h3>

        <div class="mt-4 quiz-info">
            <div class="d-flex">
                <label>Subject :</label>
                <div class="quiz-field green">{{ quiz.subject_name }}</div>
            </div>
            <div class="d-flex">
                <label>Chapter :</label>
                <div class="quiz-field green">{{ quiz.chapter_name }}</div>
            </div>
            <div class="d-flex">
                <label>Number of Questions :</label>
                <div class="quiz-field black">{{ quiz.total_ques }}</div>
            </div>
            <div class="d-flex">
                <label>Total Marks :</label>
                <div class="quiz-field black">{{ quiz.total_marks }}</div>
            </div>
            <div class="d-flex">
                <label>Scheduled Date :</label>
                <div class="quiz-field red">{{ quiz.date_of_quiz.strftime('%d/%m/%Y') }}</div>
            </div>
            <div class="d-flex">
                <label>Duration :</label>
                <div class="quiz-field red">{{ quiz.time_duration.split(':')[0] | int * 60  + quiz.time_duration.split(':')[1] | int }} minutes</div>
            </div>
        </div>

        <a href="{{ url_for('user.dashboard') }}" class="btn-close-custom">Close</a>
    </div>
</body>
</html>
