<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Question</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block styles %}
        <link rel="stylesheet" href="{{ url_for('static', filename='css/add_question.css') }}">
        <style>
            body {
                background: url("{{ url_for('static', filename='img/bgimage.jpg') }}") no-repeat center top fixed;
                background-size: cover; 
                background-position: center -5vh;
                background-attachment: fixed;
                min-height: 100vh; /* Ensure it covers the whole screen */
            }
            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(45, 55, 76, 0.654); /* Dark overlay */
                z-index: -1;
            }
        </style>
    {% endblock %}
</head>
<body>
    <div class="question-container">
        <h3 class="section-title">Edit Question</h3>
        <form method="POST">
            <div class="form-group">
                <label for="question_statement"><strong>Question Statement:</strong></label>
                <textarea id="question_statement" name="question_statement" class="form-control" required>{{ question.question_statement }}</textarea>
            </div>

            <div class="coustom-border p-3 mt-4">
                <h6 class="section-title">Single Option Correct</h6>
                <div class="options-container">
                    <div class="option-box">
                        <label><strong>Option 1:</strong></label>
                        <input type="text" class="form-control" name="option1" value="{{ question.option1 }}" required>
                    </div>
                    <div class="option-box">
                        <label><strong>Option 2:</strong></label>
                        <input type="text" class="form-control" name="option2" value="{{ question.option2 }}" required>
                    </div>
                    <div class="option-box">
                        <label><strong>Option 3:</strong></label>
                        <input type="text" class="form-control" name="option3" value="{{ question.option3 }}" required>
                    </div>
                    <div class="option-box">
                        <label><strong>Option 4:</strong></label>
                        <input type="text" class="form-control" name="option4" value="{{ question.option4 }}" required>
                    </div>
                </div>

                <div class="container mt-4 p-2">
                    <div class="row align-items-center">
                        <div class="col-md-6 d-flex align-items-center">
                            <label class="me-3"><strong>Correct Option:</strong></label>
                            <input type="number" class="form-control impt-border w-25" name="correct_option" min="1" max="4" value="{{ question.correct_option }}" required>
                        </div>

                        <div class="col-md-6 d-flex align-items-center">
                            <label class="me-3"><strong>Marks:</strong></label>
                            <input type="number" class="form-control impt-border" name="marks" value="{{ question.marks }}" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-save-custom">Save Changes</button>
                <a href="{{ url_for('admin.quizzes') }}" class="btn-close-custom">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
