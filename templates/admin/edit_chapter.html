<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Chapter</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block styles %}
        <link rel="stylesheet" href="{{ url_for('static', filename='css/add_subject.css') }}">
        <style>
            body {
                background: url("{{ url_for('static', filename='img/bgimage.jpg') }}") no-repeat center top fixed;
                background-size: cover; 
                background-position: center -5vh;
                background-attachment: fixed;
                min-height: 100vh; /* Ensure it covers the whole screen */
            }
            body::before {
                content: "";
                position: relative;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(45, 55, 76, 0.654); /* Dark overlay */
                z-index: -1;
            }
        </style>
    {% endblock %}
</head>
<body>
    <div class="add-chapter-container">
        <h2 class="title">Edit Chapter</h2>
        <form method="POST">
            <div class="form-group">
                <label for="chapter_name">Name:</label>
                <input type="text" id="chapter_name" name="chapter_name" value="{{ chapter.name }}" required>
            </div>
    
            <div class="form-group">
                <label for="chapter_description">Description:</label>
                <textarea id="chapter_description" name="chapter_description" rows="3" required>{{ chapter.description }}</textarea>
            </div>
    
            <div class="button-group">
                <button type="submit" class="btn-save-custom me-5">Save</button>
                <a href="{{ url_for('admin.dashboard') }}" class="btn-close-custom">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
